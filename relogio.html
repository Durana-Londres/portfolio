<body style="background-color: rgb(87, 111, 133);"> <div id="tot">
    <p style="text-align: center;">
    <p id="hora"> :</p> <p>:</p>  <p id="minuto"></p> <p>:</p> <p id="segundo"></p> </div> </p>



    <script>
        let data = new Date()
      console.log(  data.getHours() ,":" ,data.getMinutes() ,":", data.getSeconds())
  
      if(data.getSeconds() < 10 ){
       document.getElementById("segundo").innerHTML = "0" + data.getSeconds()
      } else{
        document.getElementById("segundo").innerHTML = data.getSeconds()
      }

      if(data.getMinutes() <10){
      document.getElementById("minuto").innerHTML = "0"+ data.getMinutes()
       } else{
        document.getElementById("minuto").innerHTML = data.getMinutes()
       }

      if(data.getHours() <10 ){
         document.getElementById("hora").innerHTML =  "0" + data.getHours()
      } else{
        document.getElementById("hora").innerHTML = data.getHours()
      }
 </script>
